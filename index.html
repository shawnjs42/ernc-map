<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eagle Rock NC · District Map</title>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ernc-red:       #E84E38;
      --ernc-green:     #155e14;
      --ernc-cream:     #FFFDF1;
      --charcoal:       #1e1b18;
      --slate:          #5a5550;
      --border:         #ddd8d0;

      --subdistricts:   #155e14;
      --city:           #2563EB;
      --county:         #7C3AED;
      --assembly:       #d97706;
      --senate:         #0D9488;
      --congressional:  #db2777;
    }

    html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--charcoal); }

    #map { position: absolute; inset: 0; }

    /* ── Controls panel ── */
    #controls {
      position: absolute;
      top: 12px; right: 12px;
      width: 236px;
      background: var(--ernc-cream);
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.22);
      overflow: hidden;
      z-index: 10;
    }

    .panel-header {
      background: var(--charcoal);
      color: var(--ernc-cream);
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      border-bottom: 2px solid var(--ernc-red);
    }

    .panel-header h1 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 0.92rem;
      font-weight: 400;
      line-height: 1.2;
    }

    .panel-header h1 span {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #aaa;
      margin-top: 1px;
    }

    .chevron {
      font-size: 0.6rem; color: #888;
      transition: transform 0.2s;
      flex-shrink: 0; margin-left: 8px;
    }
    .chevron.up { transform: rotate(180deg); }

    .panel-body { padding: 12px 14px 14px; }
    .panel-body.hidden { display: none; }

    /* ── Always-on boundary row ── */
    .boundary-row {
      display: flex; align-items: center; gap: 9px;
      padding: 3px 0 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .swatch-box {
      width: 22px; height: 13px; border-radius: 3px; flex-shrink: 0;
      background: rgba(232,78,56,0.15);
      border: 2px solid var(--ernc-red);
    }

    .boundary-label { font-size: 0.78rem; font-weight: 500; color: var(--charcoal); line-height: 1.2; }
    .boundary-label small { display: block; font-size: 0.66rem; font-weight: 300; color: var(--slate); }

    /* ── Section headings ── */
    .section-title {
      font-size: 0.62rem; font-weight: 500;
      letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--slate); margin-bottom: 6px;
    }

    .section-divider {
      border: none; border-top: 1px solid var(--border);
      margin: 10px 0;
    }

    /* ── Toggle rows (works for both radio and checkbox) ── */
    .toggle-row {
      display: flex; align-items: center; gap: 9px;
      padding: 5px 7px; border-radius: 5px;
      cursor: pointer; transition: background 0.12s;
    }
    .toggle-row:hover  { background: rgba(0,0,0,0.04); }
    .toggle-row.active { background: rgba(0,0,0,0.06); }

    .toggle-row input[type="radio"],
    .toggle-row input[type="checkbox"] {
      appearance: none;
      width: 13px; height: 13px;
      border: 1.5px solid #bbb; border-radius: 50%;
      flex-shrink: 0; cursor: pointer;
      transition: border-color 0.15s;
    }
    .toggle-row input[type="checkbox"] { border-radius: 3px; }

    .toggle-row input[type="radio"]:checked,
    .toggle-row input[type="checkbox"]:checked {
      border-color: var(--active-color, #333);
      background: var(--active-color, #333);
      box-shadow: inset 0 0 0 2.5px var(--ernc-cream);
    }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%; flex-shrink: 0;
    }
    .dash-dot {
      width: 18px; height: 3px; border-radius: 2px;
      flex-shrink: 0;
      background: repeating-linear-gradient(
        to right,
        var(--ernc-green) 0px, var(--ernc-green) 5px,
        transparent 5px, transparent 8px
      );
    }

    .toggle-row span.label {
      font-size: 0.78rem; color: var(--charcoal); line-height: 1;
    }

    /* ── Popup ── */
    .mapboxgl-popup-content {
      font-family: 'DM Sans', sans-serif;
      border-radius: 8px;
      padding: 0;
      box-shadow: 0 4px 18px rgba(0,0,0,0.15);
      overflow: hidden;
      min-width: 180px;
    }

    .popup-inner { padding: 11px 14px; }

    .popup-type {
      font-size: 0.62rem; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      margin-bottom: 3px;
    }

    .popup-name {
      font-weight: 500; font-size: 0.9rem;
      color: var(--charcoal); line-height: 1.3;
    }

    /* ── Mapbox ── */
    .mapboxgl-ctrl-top-left { top: 12px; left: 12px; }

    @media (max-width: 580px) {
      #controls {
        top: auto;
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;
        border-radius: 14px 14px 0 0;
        max-height: 60vh;
        display: flex;
        flex-direction: column;
      }
      .panel-header {
        border-radius: 14px 14px 0 0;
        padding: 14px 18px;
      }
      .panel-body {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 24px;
      }
    }
  </style>
</head>
<body>

<div id="map"></div>

<div id="controls">
  <div class="panel-header" id="panel-toggle">
    <h1>Eagle Rock NC <span>District Map</span></h1>
    <span class="chevron up" id="chevron">▲</span>
  </div>

  <div class="panel-body" id="panel-body">

    <!-- Always-on NC boundary -->
    <div class="boundary-row">
      <div class="swatch-box"></div>
      <div class="boundary-label">
        ERNC Boundary
        <small>Always visible</small>
      </div>
    </div>

    <!-- ERNC Subdistricts (on by default) -->
    <div class="section-title">ERNC Subdistricts</div>
    <label class="toggle-row active" for="cb-sub">
      <input type="checkbox" id="cb-sub" checked
             style="--active-color: var(--subdistricts); border-radius:3px;">
      <span class="dash-dot"></span>
      <span class="label">Show Subdistricts</span>
    </label>

    <hr class="section-divider">

    <!-- Who Represents Me — local to federal -->
    <div class="section-title">Who Represents Me</div>
    <div id="represent-group">

      <label class="toggle-row" for="r-none">
        <input type="radio" name="represent" id="r-none" value="none" checked
               style="--active-color: #555;">
        <span class="dot" style="background:#ddd; border:1px solid #ccc;"></span>
        <span class="label">None</span>
      </label>

      <label class="toggle-row" for="r-city">
        <input type="radio" name="represent" id="r-city" value="cityCouncil"
               style="--active-color: var(--city);">
        <span class="dot" style="background: var(--city);"></span>
        <span class="label">LA City Council</span>
      </label>

      <label class="toggle-row" for="r-county">
        <input type="radio" name="represent" id="r-county" value="countyBod"
               style="--active-color: var(--county);">
        <span class="dot" style="background: var(--county);"></span>
        <span class="label">County Supervisor</span>
      </label>

      <label class="toggle-row" for="r-assembly">
        <input type="radio" name="represent" id="r-assembly" value="assembly"
               style="--active-color: var(--assembly);">
        <span class="dot" style="background: var(--assembly);"></span>
        <span class="label">CA Assembly</span>
      </label>

      <label class="toggle-row" for="r-senate">
        <input type="radio" name="represent" id="r-senate" value="senate"
               style="--active-color: var(--senate);">
        <span class="dot" style="background: var(--senate);"></span>
        <span class="label">CA Senate</span>
      </label>

      <label class="toggle-row" for="r-congress">
        <input type="radio" name="represent" id="r-congress" value="congressional"
               style="--active-color: var(--congressional);">
        <span class="dot" style="background: var(--congressional);"></span>
        <span class="label">US House</span>
      </label>

    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  CONFIGURATION
// ═══════════════════════════════════════════════════════════════════

const MAPBOX_TOKEN = 'pk.eyJ1Ijoic2hhd25qcyIsImEiOiJjbXA4amU2ZTkwZDQ2MnhwdHpjbWFoMWQ4In0.J--HcwXZaW7o-30sDd2Aqw';

const TILESETS = {
  nc:            'shawnjs.947wac47',
  subdistricts:  'shawnjs.bho9281c',
  cityCouncil:   'shawnjs.a0l435xo',
  countyBod:     'shawnjs.bp7khkbi',
  assembly:      'shawnjs.1or4vwo2',
  senate:        'shawnjs.4o0qoysq',
  congressional: 'shawnjs.27u0lrb5'
};

const SOURCE_LAYERS = {
  nc:            'LA_Neighbhorhood_Council-4c7cvi',
  subdistricts:  'Eagle_Rock_NC_Shapefile-2i8wk6',
  cityCouncil:   'LA_City_Council-5ps0sb',
  countyBod:     'LA_County_BoD-4yfvkt',
  assembly:      'CA_State_Assembly-1kblxw',
  senate:        'CA_State_Senate-bnb84k',
  congressional: 'CA_Congressional-4tx61z'
};

const LABEL_FIELDS = {
  nc:            'name',
  subdistricts:  'DISTRICT',
  cityCouncil:   'DISTRICT',
  countyBod:     'District',
  assembly:      'NAME',
  senate:        'NAME',
  congressional: 'NAME'
};

const POPUP_FIELDS = {
  nc:            'name',
  subdistricts:  'DISTRICT',
  cityCouncil:   ['DISTRICT', 'MEMBER'],
  countyBod:     'TOOLTIP',
  assembly:      'NAME',
  senate:        'NAME',
  congressional: 'NAME'
};

const LAYER_LABELS = {
  subdistricts:  'ERNC Subdistrict',
  cityCouncil:   'LA City Council',
  countyBod:     'LA County Supervisor',
  assembly:      'CA Assembly',
  senate:        'CA Senate',
  congressional: 'US House'
};

const COLORS = {
  nc:            '#E84E38',
  subdistricts:  '#155e14',
  cityCouncil:   '#2563EB',
  countyBod:     '#7C3AED',
  assembly:      '#d97706',
  senate:        '#0D9488',
  congressional: '#db2777'
};

const DEFAULT_NC     = 'EAGLE ROCK NC';
const DEFAULT_CENTER = [-118.2077, 34.1366];
const DEFAULT_ZOOM   = 13.2;

// Bounding box of the ERNC polygon — used to fitBounds on mobile
const ERNC_BOUNDS = [
  [-118.2296, 34.1163],  // southwest [lng, lat]
  [-118.1804, 34.1517]   // northeast [lng, lat]
];

// ═══════════════════════════════════════════════════════════════════
//  MAP INIT
// ═══════════════════════════════════════════════════════════════════

const params   = new URLSearchParams(window.location.search);
const targetNC = (params.get('nc') || DEFAULT_NC).trim();

mapboxgl.accessToken = MAPBOX_TOKEN;

const map = new mapboxgl.Map({
  container: 'map',
  style:     'mapbox://styles/mapbox/light-v11',
  center:    DEFAULT_CENTER,
  zoom:      DEFAULT_ZOOM
});

map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-left');

// ═══════════════════════════════════════════════════════════════════
//  LAYERS
// ═══════════════════════════════════════════════════════════════════

map.on('load', () => {

  // Fit full ERNC polygon into view on mobile
  if (isMobile) {
    map.fitBounds(ERNC_BOUNDS, { padding: 24, duration: 0 });
  }

  // ── NC boundary ────────────────────────────────────────────────

  map.addSource('nc', { type: 'vector', url: `mapbox://${TILESETS.nc}` });

  map.addLayer({
    id: 'nc-all-line', type: 'line', source: 'nc',
    'source-layer': SOURCE_LAYERS.nc,
    paint: { 'line-color': '#bbb', 'line-width': 0.5, 'line-opacity': 0.4 }
  });

  map.addLayer({
    id: 'nc-highlight-fill', type: 'fill', source: 'nc',
    'source-layer': SOURCE_LAYERS.nc,
    filter: ['==', ['get', LABEL_FIELDS.nc], targetNC],
    paint: { 'fill-color': COLORS.nc, 'fill-opacity': 0.1 }
  });

  map.addLayer({
    id: 'nc-highlight-line', type: 'line', source: 'nc',
    'source-layer': SOURCE_LAYERS.nc,
    filter: ['==', ['get', LABEL_FIELDS.nc], targetNC],
    paint: { 'line-color': COLORS.nc, 'line-width': 2.5 }
  });

  // ── Subdistricts (on by default) ───────────────────────────────

  map.addSource('subdistricts', { type: 'vector', url: `mapbox://${TILESETS.subdistricts}` });

  map.addLayer({
    id: 'subdistricts-fill', type: 'fill', source: 'subdistricts',
    'source-layer': SOURCE_LAYERS.subdistricts,
    layout: { visibility: 'visible' },
    paint: { 'fill-color': COLORS.subdistricts, 'fill-opacity': 0.07 }
  });

  map.addLayer({
    id: 'subdistricts-line', type: 'line', source: 'subdistricts',
    'source-layer': SOURCE_LAYERS.subdistricts,
    layout: { visibility: 'visible' },
    paint: {
      'line-color': COLORS.subdistricts,
      'line-width': 1.5,
      'line-dasharray': [3, 2]
    }
  });

  map.addLayer({
    id: 'subdistricts-label', type: 'symbol', source: 'subdistricts',
    'source-layer': SOURCE_LAYERS.subdistricts,
    layout: {
      visibility: 'visible',
      'text-field': ['get', LABEL_FIELDS.subdistricts],
      'text-size': 11,
      'text-font': ['DIN Pro Medium', 'Arial Unicode MS Regular'],
      'text-anchor': 'center', 'text-max-width': 8
    },
    paint: {
      'text-color': COLORS.subdistricts,
      'text-halo-color': 'rgba(255,253,241,0.9)',
      'text-halo-width': 1.5
    }
  });

  addPopup('subdistricts');

  // ── District layers (radio — one at a time) ────────────────────

  const DISTRICT_KEYS = ['cityCouncil', 'countyBod', 'assembly', 'senate', 'congressional'];

  DISTRICT_KEYS.forEach(key => {
    const defaultVis = 'none';

    map.addSource(key, { type: 'vector', url: `mapbox://${TILESETS[key]}` });

    map.addLayer({
      id: `${key}-fill`, type: 'fill', source: key,
      'source-layer': SOURCE_LAYERS[key],
      layout: { visibility: defaultVis },
      paint: { 'fill-color': COLORS[key], 'fill-opacity': 0.1 }
    });

    map.addLayer({
      id: `${key}-line`, type: 'line', source: key,
      'source-layer': SOURCE_LAYERS[key],
      layout: { visibility: defaultVis },
      paint: { 'line-color': COLORS[key], 'line-width': 1.5 }
    });

    map.addLayer({
      id: `${key}-label`, type: 'symbol', source: key,
      'source-layer': SOURCE_LAYERS[key],
      layout: {
        visibility: defaultVis,
        'text-field': ['get', LABEL_FIELDS[key]],
        'text-size': 11,
        'text-font': ['DIN Pro Medium', 'Arial Unicode MS Regular'],
        'text-anchor': 'center', 'text-max-width': 8
      },
      paint: {
        'text-color': COLORS[key],
        'text-halo-color': 'rgba(255,253,241,0.9)',
        'text-halo-width': 1.5
      }
    });

    addPopup(key);
  });

  // ── Shared popup builder ───────────────────────────────────────

  function addPopup(key) {
    map.on('click', `${key}-fill`, (e) => {
      const props = e.features[0].properties;
      const field = POPUP_FIELDS[key];
      const name  = Array.isArray(field)
        ? field.map(f => props[f]).filter(Boolean).join(' · ')
        : (props[field] || '—');
      new mapboxgl.Popup({ offset: 8 })
        .setLngLat(e.lngLat)
        .setHTML(`
          <div class="popup-inner">
            <div class="popup-type" style="color:${COLORS[key]}">${LAYER_LABELS[key]}</div>
            <div class="popup-name">${name}</div>
          </div>`)
        .addTo(map);
    });
    map.on('mouseenter', `${key}-fill`, () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', `${key}-fill`, () => { map.getCanvas().style.cursor = ''; });
  }

});

// ═══════════════════════════════════════════════════════════════════
//  TOGGLE CONTROLS
// ═══════════════════════════════════════════════════════════════════

// Subdistrict checkbox
document.getElementById('cb-sub').addEventListener('change', (e) => {
  const vis = e.target.checked ? 'visible' : 'none';
  ['fill', 'line', 'label'].forEach(t => {
    if (map.getLayer(`subdistricts-${t}`))
      map.setLayoutProperty(`subdistricts-${t}`, 'visibility', vis);
  });
  e.target.closest('.toggle-row').classList.toggle('active', e.target.checked);
});

// District radio buttons
const DISTRICT_KEYS = ['cityCouncil', 'countyBod', 'assembly', 'senate', 'congressional'];

document.querySelectorAll('input[name="represent"]').forEach(radio => {
  radio.addEventListener('change', (e) => {
    const selected = e.target.value;

    document.querySelectorAll('#represent-group .toggle-row').forEach(row => {
      row.classList.remove('active');
    });
    e.target.closest('.toggle-row').classList.add('active');

    DISTRICT_KEYS.forEach(key => {
      const vis = (key === selected) ? 'visible' : 'none';
      ['fill', 'line', 'label'].forEach(t => {
        if (map.getLayer(`${key}-${t}`))
          map.setLayoutProperty(`${key}-${t}`, 'visibility', vis);
      });
    });
  });
});

// Panel collapse
const panelToggle = document.getElementById('panel-toggle');
const panelBody   = document.getElementById('panel-body');
const chevron     = document.getElementById('chevron');

// Collapse on mobile — check both innerWidth and screen width to handle iframes
const isMobile = window.innerWidth < 580 || screen.width < 640;
let isCollapsed = isMobile;

if (isCollapsed) {
  panelBody.classList.add('hidden');
  chevron.classList.remove('up');
}

panelToggle.addEventListener('click', () => {
  isCollapsed = !isCollapsed;
  panelBody.classList.toggle('hidden', isCollapsed);
  chevron.classList.toggle('up', !isCollapsed);
});

</script>
</body>
</html>
